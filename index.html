<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Stack colorful effects on your cursor, tweak them, and share a link to what you made." />
    <title>Cursor Playground</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%236ee7ff'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23b28cff' stroke-width='2' stroke-dasharray='4 5'/%3E%3C/svg%3E" />

  <body>
    <canvas id="sky" aria-hidden="true"></canvas>

    <main id="stage" class="stage">
      <canvas id="back" class="layer" aria-hidden="true"></canvas>

        <p class="eyebrow">An interactive toy</p>

      <canvas id="front" class="layer" aria-hidden="true"></canvas>
    </main>

    <aside id="panel" class="panel" aria-label="Effects controls"></aside>

    <script type="module" src="/src/main.ts"></script>
