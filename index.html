    <meta property="og:url" content="https://ethanmanco.github.io/cursor-playground/" />

    <meta name="twitter:description" content="Stack glowing space effects on your cursor, tweak them, and share what you made." />

  <body>
    <canvas id="sky" aria-hidden="true" data-cp-trip></canvas>

    <main id="stage" class="stage">
      <canvas id="back" class="layer" aria-hidden="true"></canvas>
      <div class="hero">
        <p class="eyebrow">An interactive toy</p>
        <h1 id="heading" class="heading">Cursor Playground</h1>
        <p class="tagline">Turn on effects in the panel, then move, draw, and click.</p>
      </div>
      <canvas id="front" class="layer" aria-hidden="true"></canvas>
    </main>

    <aside id="panel" class="panel" aria-label="Effects controls" data-cp-keep-cursor></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
